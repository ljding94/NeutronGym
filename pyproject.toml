[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcstas-mcp"
version = "0.1.0"
description = "MCP server exposing McStas neutron ray-tracing simulations to LLM agents"
requires-python = ">=3.10"
dependencies = [
    "mcstasscript>=0.0.84",
    "fastmcp>=2",
    "numpy",
    "matplotlib",
]

[project.scripts]
mcstas-mcp = "mcstas_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: compiles/runs McStas (minutes); deselect with -m 'not slow'"]
